name: Get Citation Data

on:
  schedule:
    # Two attempts per day. Google blocks datacenter IPs intermittently, so a
    # second offset run roughly doubles the chance that one of them gets
    # through.
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # The script self-limits to ~20 min of retrying; this is the outer guard so
    # a stuck job can never occupy a runner for hours. Keep it comfortably
    # above the script's own ceiling (plus install time).
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Reqs
      run: |
        cd ./google_scholar_crawler
        pip3 install -r requirements.txt

    # No continue-on-error here on purpose. If Google refuses, this step goes
    # red and the job fails -- a silent green tick that published nothing is
    # worse than a visible failure.
    - name: Fetch citation data
      run: |
        cd ./google_scholar_crawler
        python3 main.py
      env:
        GOOGLE_SCHOLAR_ID: 'XT17oUEAAAAJ'

    - name: Publish data
      run: |
        cd ./google_scholar_crawler/results
        git init --quiet
        git config --local user.name "${GITHUB_ACTOR}"
        git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git add gs_data.json gs_data_shieldsio.json
        if git diff --cached --quiet; then
          echo "No change in citation data; nothing to publish."
          exit 0
        fi
        git commit -m "Updated Citation Data"
        export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
