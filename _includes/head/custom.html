{% include base_path %}

<!-- 图标 32/16/apple-touch 由 _includes/head.html 统一输出（绝对路径），此处不再重复。
     下面几条是 head.html 没有的。注：此前这里引用的两个图标文件在仓库中并不存在，已改指真实存在的文件。 -->
<link rel="shortcut icon" href="/favicon.ico">
<link rel="mask-icon" href="/images/safari-pinned-tab.svg" color="#000000">
<meta name="msapplication-TileColor" content="#000000">
<meta name="msapplication-TileImage" content="/images/mstile-144x144.png">
<meta name="theme-color" content="#ffffff">

<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css?v={{ site.time | date: '%s' }}" media="print" onload="this.media='all'">

<style>
		.author {
			text-decoration: none !important;
			color: var(--ct-heading);
		}

		.author:hover {
			text-decoration: underline;
			color: var(--ct-author-hover);
		}
	    pre {
	      background-color: var(--ct-pre-bg);
	      color: var(--ct-pre-text);
	      padding: 10px;
	      border-radius: 5px;
	    }
</style>
