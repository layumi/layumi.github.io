<meta charset="utf-8">

<!-- 主题防闪烁：必须在样式表之前执行，首屏前就定好 html[data-theme]。
     默认浅色（不跟随系统），只有访客显式切换过才用深色。 -->
<script>
  (function () {
    try {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  })();
</script>

    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    color: var(--ct-heading);
    background: var(--ct-bg);
  }

  body {
    margin: 0;
    padding: 0;
  }

  header, nav, footer {
    display: block;
  }

  article h1 {
    font-size: 1.75em;
    font-weight: bold;
    line-height: 1.3;
    margin-top: 1em;
    margin-bottom: 0.5em;
  }

  a {
    color: var(--ct-link);
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }
</style>
