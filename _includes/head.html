<meta charset="utf-8">

<!-- 主题：默认「自动」——按访客**本地时间**（默认 19:00–06:59 视为夜间）与系统偏好
     （prefers-color-scheme）共同决定；访客在顶栏显式切换过之后，就一直用他的选择。
     必须在样式表之前同步执行，首屏前就定好 html[data-theme]，否则深色访客会先闪一下白底。
     切换逻辑在 _includes/scripts.html，两处共用下面挂在 window 上的 __ctTheme。 -->
<script>
  (function () {
    var root = document.documentElement;
    var NIGHT_START = 19, NIGHT_END = 7;   // 夜间时段，改这里即可

    function stored() {
      try {
        var v = localStorage.getItem('theme');
        return (v === 'light' || v === 'dark' || v === 'auto') ? v : 'auto';
      } catch (e) { return 'auto'; }
    }
    function sysDark() {
      return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    }
    function isNight(d) {
      var h = (d || new Date()).getHours();
      return h >= NIGHT_START || h < NIGHT_END;
    }
    function resolve(mode) {
      mode = mode || stored();
      if (mode === 'light' || mode === 'dark') return mode;      // 访客显式选择优先
      return (isNight() || sysDark()) ? 'dark' : 'light';        // 自动：夜间或系统深色
    }
    function apply(mode) {
      var m = mode || stored();
      var resolved = resolve(m);
      root.setAttribute('data-theme-mode', m);
      if (resolved === 'dark') { root.setAttribute('data-theme', 'dark'); }
      else { root.removeAttribute('data-theme'); }
      return resolved;
    }
    window.__ctTheme = {
      resolve: resolve, apply: apply, stored: stored,
      isNight: isNight, sysDark: sysDark, NIGHT: [NIGHT_START, NIGHT_END]
    };
    apply();
  })();
</script>
